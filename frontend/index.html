    <!-- Google Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DecisionOS",
      "url": "https://decisionos-ai-boardroom.vercel.app/",
      "description": "Executive strategic intelligence platform powered by an autonomous multi-agent AI Board of Directors and ChromaDB vector memory.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Multi-Agent Dialectical Debate",
        "ChromaDB Long-Term Memory Vault",
        "Turn-Synchronized Voice Narration",
        "Speech-to-Text Voice Dictation",
        "12+ Language Localization"
      ]
    }
    </script>


  </head>
  <body style="background-color: #0b0907; margin: 0;">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('DecisionOS PWA Service Worker Registered:', reg.scope);
              // Register Background Sync if supported
              if ('sync' in reg) {
                reg.sync.register('decisionos-sync').catch(function() {});
              }
              // Register Periodic Background Sync if supported
              if ('periodicSync' in reg) {
                reg.periodicSync.register('decisionos-periodic-sync', {
                  minInterval: 24 * 60 * 60 * 1000
                }).catch(function() {});
              }
            })
            .catch(function(err) {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
