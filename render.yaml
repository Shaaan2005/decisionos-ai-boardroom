services:
  - type: web
    name: decisionos-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: decisionos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: DEFAULT_LLM_PROVIDER
        value: "simulated"
      - key: BACKEND_CORS_ORIGINS
        sync: false

  - type: static_site
    name: decisionos-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: decisionos-db
    plan: free
